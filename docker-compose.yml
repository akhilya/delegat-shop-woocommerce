name: delegat-shop-woocommerce

# WooCommerce + vendored Delegat Bridge.
# Local: docker compose up -d
# Dokploy: same compose + Environment + Domains UI (do not add Traefik labels).

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MARIADB_USER: ${MYSQL_USER:-wordpress}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wordpress}
    volumes:
      - woo_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  wordpress:
    image: ghcr.io/akhilya/delegat-shop-woocommerce:${SHOP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PUBLISH_PORT:-8088}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${SITE_URL:-http://localhost:8088}');
        define('WP_SITEURL', '${SITE_URL:-http://localhost:8088}');
    volumes:
      - woo_html:/var/www/html

  wp-init:
    image: wordpress:cli-php8.2
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      SITE_URL: ${SITE_URL:-http://localhost:8088}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-admin}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
      WP_TITLE: ${WP_TITLE:-Delegat WooCommerce shop}
      DELEGAT_API_KEY: ${DELEGAT_API_KEY:-delegat-woo-sandbox-api-key-local}
    volumes:
      - woo_html:/var/www/html
      - ./init-wp.sh:/sandbox/init-wp.sh:ro
    entrypoint: ["sh", "-c", "tr -d '\\r' < /sandbox/init-wp.sh > /tmp/init-wp.sh && sh /tmp/init-wp.sh"]
    restart: on-failure

volumes:
  woo_db:
  woo_html:
